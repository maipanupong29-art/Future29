name: Future29
options:
  bundleIdPrefix: com.maipanupong29
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Future29:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Future29App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maipanupong29.future29
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Future29
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
