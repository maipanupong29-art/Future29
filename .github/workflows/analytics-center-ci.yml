name: Analytics Center CI

on:
  pull_request:
    paths:
      - "analytics-center/**"
      - ".github/workflows/analytics-center-ci.yml"
  push:
    branches: [main]
    paths:
      - "analytics-center/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-center/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile app.py metrics.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Smoke-test Streamlit startup
        run: |
          streamlit run app.py --server.headless true --server.port 8765 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
